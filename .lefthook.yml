pre-commit:
  parallel: true
  commands:
    biome_check_staged:
      run: npx biome check --write --staged
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    biome_full:
      run: npx biome check .
    typescript_check:
      run: yarn tsc --noEmit --pretty false
    dependencies_check:
      run: bash scripts/check-expo-deps.sh    
    expo:
      run: |
        # Run expo-doctor and capture output
        OUTPUT=$(npx expo-doctor 2>&1)
        EXIT_CODE=$?
        echo "$OUTPUT"
        
        # If it failed, check if it's only known non-critical warnings
        if [ $EXIT_CODE -ne 0 ]; then
          # Check for duplicate dependencies (often non-critical if minor version differences)
          if echo "$OUTPUT" | grep -q "duplicate dependencies"; then
            echo ""
            echo "⚠️  Warning: Duplicate dependencies detected (non-critical for now)"
            echo "   This is often due to transitive dependencies and can be addressed later"
          fi
          
          # Check for React Native Directory warnings (already configured to ignore)
          if echo "$OUTPUT" | grep -q "React Native Directory"; then
            echo ""
            echo "ℹ️  React Native Directory warnings (configured to ignore)"
          fi
          
          # Only fail if there are actual critical errors (not just the above warnings)
          if echo "$OUTPUT" | grep -qE "(✖|error|Error)" && ! echo "$OUTPUT" | grep -qE "(duplicate dependencies|React Native Directory)"; then
            exit $EXIT_CODE
          else
            echo ""
            echo "✅ expo-doctor: Only non-critical warnings found, continuing..."
            exit 0
          fi
        fi
    test_unit:
      run: yarn test:unit
